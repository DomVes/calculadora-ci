name: calculadora-ci

services:
  calculadora:
    build:
      context: .
      dockerfile: servicios/calculadora/Dockerfile
    image: calculadora:entrega1
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-desarrollo}
      BITACORA_URL: http://bitacora:8080
      BITACORA_TOKEN: ${BITACORA_TOKEN}
    ports:
      - "5000:5000"
    networks:
      - calculadora_red
    depends_on:
      bitacora:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/salud')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  bitacora:
    build:
      context: .
      dockerfile: servicios/bitacora/Dockerfile
    image: bitacora:entrega1
    env_file:
      - .env
    environment:
      DATOS_DIR: /datos
      BITACORA_TOKEN: ${BITACORA_TOKEN}
    volumes:
      - bitacora_datos:/datos
    ports:
      - "8080:8080"
    networks:
      - calculadora_red
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/salud')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  calculadora_red:
    name: calculadora_red
    driver: bridge

volumes:
  bitacora_datos:
    name: bitacora_datos
